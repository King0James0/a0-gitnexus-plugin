# GitNexus plugin defaults. Override per-scope via the plugin config UI or env.
#
# npm package version of the gitnexus CLI to install (the CLI provides `gitnexus mcp`).
# "latest" installs the newest published version; or pin one, e.g. "1.6.4".
gitnexus_version: latest

# Key under mcp_servers.mcpServers that this plugin registers (and removes on uninstall).
mcp_server_name: gitnexus

# Canvas surface (route 2 — screencast). The gitnexus web UI is local-only (it connects to its
# server at localhost over Server-Sent Events), so we render it in a headless Chromium INSIDE the
# container and screencast that to the Canvas. All three ports bind 127.0.0.1 only.
serve_port: 4747    # `gitnexus serve` graph web UI (what the in-container Chromium loads)
cdp_port: 9223      # the headless Chromium's CDP/remote-debugging port (bridge connects here)
bridge_port: 14601  # the screencast bridge (registered with A0's /desktop gateway; != obsidian's)

# Scheduled commit-aware re-index. On install the plugin registers an Agent Zero ScheduledTask
# named "GitNexus weekly re-index" that runs helpers/reindex.py on this schedule. The task only
# re-indexes already-indexed git repos whose HEAD moved since they were last indexed (it never
# discovers or indexes new repos). Edit the schedule/time/cadence directly in the Scheduler UI
# after install — the plugin won't overwrite your changes; these values are just the install-time
# default. `schedule` fields are standard crontab (minute hour day month weekday).
reindex:
  enabled: true
  schedule:
    minute: "0"
    hour: "6"
    day: "*"
    month: "*"
    weekday: "0"   # 0 = Sunday  ->  weekly, Sundays at 06:00
  timezone: ""     # "" = Agent Zero's configured timezone
